<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بنك الخليج - سحب مليونير الدانة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient-1: #7A0019;
            --bg-gradient-2: #B3002D;
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.2);
            --btn-gradient-1: #D1003F;
            --btn-gradient-2: #FF3366;
            --text-main: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --gold-text: #FFDF73;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            color: var(--text-main);
            overflow-x: hidden;
        }

        .page-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(30, 0, 8, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            width: 100%;
        }

        .hamburger-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-switch {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--gold-text);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .bank-logo {
            height: 30px;
            width: auto;
            object-fit: contain;
        }

        /* Content Container - ملء المساحة الطبيعية بلا فراغات عملاقة */
        .content-container {
            padding: 24px 16px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        /* Hero Section */
        .hero-card {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 100%;
        }

        .hero-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            color: #1A050A;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            z-index: 2;
        }

        .hero-image-wrapper {
            width: 100%;
            background: rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }

        /* Typography */
        .headline-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1.25;
        }

        h1 span {
            background: linear-gradient(135deg, #FFFFFF 0%, var(--gold-text) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Form Styling */
        .registration-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-group i {
            position: absolute;
            right: 18px;
            color: var(--gold-text);
            font-size: 16px;
        }

        .form-input {
            width: 100%;
            height: 56px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 0 50px 0 16px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-input:focus {
            border-color: var(--gold-text);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Phone Input Component */
        .phone-wrapper {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .country-code-select {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 0 10px;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            height: 56px;
            backdrop-filter: blur(10px);
        }

        .country-code-select option {
            background: #5A0012;
            color: #FFFFFF;
        }

        .phone-input-group {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .phone-input-group i {
            position: absolute;
            right: 18px;
            color: var(--gold-text);
            font-size: 16px;
        }

        .phone-input-group .form-input {
            padding-right: 50px;
        }

        /* Primary Button */
        .submit-btn {
            background: linear-gradient(135deg, var(--btn-gradient-1) 0%, var(--btn-gradient-2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text-main);
            height: 56px;
            border-radius: var(--radius-md);
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(209, 0, 63, 0.5);
            width: 100%;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(209, 0, 63, 0.7);
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 16px 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(20, 0, 5, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .footer-text {
            font-size: 11.5px;
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 400px;
        }

        .footer-text a {
            color: var(--text-main);
            text-decoration: underline;
            font-weight: 700;
        }

        .footer-logo {
            height: 24px;
            width: auto;
            object-fit: contain;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Header -->
        <header>
            <button class="hamburger-btn" aria-label="القائمة الرئيسية">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="header-right">
                <button class="lang-switch" id="langToggle">EN</button>
                <img src="https://api.unblocksyria.com/files/logos/jp64owzw7k8pn8oc9pku6vlp/t1hz7ivrm9w1qugm5ecvcqdv-gulf-bank-logo-png-seeklogo-361997.png" alt="شعار بنك الخليج" class="bank-logo" loading="lazy">
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="content-container">
            <!-- Hero Banner Section -->
            <div class="hero-card">
                <div class="hero-badge"><i class="fa-solid fa-star"></i> جائزة كبرى</div>
                <div class="hero-image-wrapper">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUlchR3j5-WY4t2D2tPhivmC1iVHK1T0XOdZhw9NUMQFPAitK6MwG5POps&s=10" alt="سحب مليونير الدانة" class="hero-image" loading="lazy">
                </div>
            </div>

            <!-- Headline & Subtitle -->
            <div class="headline-section">
                <h1 id="mainTitle">معرفتك ممكن تخليك تصير <span>مليونيراً!</span></h1>
                <p class="subtitle" id="subTitle">سجل الآن وكن من المحظوظين في السحب.</p>
            </div>

            <!-- Registration Form -->
            <form class="registration-form" id="regForm">
                <div class="input-group">
                    <input type="text" class="form-input" id="fullName" placeholder="الاسم الكامل" required>
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="phone-wrapper">
                    <select class="country-code-select" id="countryCode" aria-label="رمز الدولة">
                        <option value="+965" selected>🇰🇼 +965</option>
                        <option value="+966">🇸🇦 +966</option>
                        <option value="+971">🇦🇪 +971</option>
                        <option value="+974">🇶🇦 +974</option>
                        <option value="+973">🇧🇭 +973</option>
                        <option value="+968">🇴🇲 +968</option>
                    </select>
                    <div class="phone-input-group">
                        <input type="tel" class="form-input" id="phoneNumber" placeholder="رقم الهاتف" required>
                        <i class="fa-solid fa-phone"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">اشترك الآن</button>
            </form>
        </main>

        <!-- Footer -->
        <footer>
            <p class="footer-text" id="footerText">
                بالنقر على زر الاشتراك، فإنك تؤكد أن عمرك يزيد عن 18 عاماً وتوافق على <a href="#terms">الشروط والأحكام</a> و<a href="#privacy">سياسة الخصوصية</a>.
            </p>
            <img src="https://api.unblocksyria.com/files/logos/jp64owzw7k8pn8oc9pku6vlp/t1hz7ivrm9w1qugm5ecvcqdv-gulf-bank-logo-png-seeklogo-361997.png" alt="شعار بنك الخليج" class="footer-logo" loading="lazy">
        </footer>
    </div>

    <script>
        const form = document.getElementById('regForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();

        const langToggle = document.getElementById('langToggle');
        let isArabic = true;

        langToggle.addEventListener('click', function() {
            isArabic = !isArabic;
            
            if (!isArabic) {
                document.documentElement.setAttribute('dir', 'ltr');

                document.getElementById('fullName').placeholder = 'Full Name';

                document.getElementById('mainTitle').innerHTML = 'معرفتك ممكن تخليك تصير <span>مليونيراً!</span>';

                document.getElementById('fullName').placeholder = 'الاسم الكامل';
                document.getElementById('phoneNumber').placeholder = 'رقم الهاتف';
                document.getElementById('submitBtn').textContent = 'اشترك الآن';
                document.getElementById('footerText').innerHTML = 'بالنقر على زر الاشتراك، فإنك تؤكد أن عمرك يزيد عن 18 عاماً وتوافق على <a href="#terms">الشروط والأحكام</a> و<a href="#privacy">سياسة الخصوصية</a>.';
            }
        });
    </script>
</body>
</html>
